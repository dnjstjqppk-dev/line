apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: messenger-postgres
spec:
  serviceName: messenger-postgres
  replicas: 1
  selector:
    matchLabels:
      app: messenger-postgres
  template:
    metadata:
      labels:
        app: messenger-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: messenger
        - name: POSTGRES_USER
          value: messenger
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: messenger-secrets
              key: postgres-password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: messenger-postgres
spec:
  selector:
    app: messenger-postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None